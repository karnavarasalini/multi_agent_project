# H2 in-memory database configuration (development)
spring.datasource.url=jdbc:h2:mem:healthdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MySQL configuration (production) - activate with "spring.profiles.active=prod"
#spring.datasource.url=jdbc:mysql://localhost:3306/healthdb
